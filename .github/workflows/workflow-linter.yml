# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-security.sh'
      - 'tests/workflow-security.sh'
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-security.sh'
      - 'tests/workflow-security.sh'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test workflow security checker
        run: bash tests/workflow-security.sh
      - name: Check workflow security
        run: bash scripts/check-workflow-security.sh
