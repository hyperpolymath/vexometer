# This workflow is managed by gh actions-lock.
name: Quality Gates
permissions:
  actions: read
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  must-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild ripgrep
      - name: Run must invariants
        run: ./scripts/run-must-gates.sh
      - name: Verify trust manifests
        run: ./scripts/trust/verify-manifest.sh
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        # Pin the action independently of the requested Rust toolchain.
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild
      - name: Run unified test gate
        # Failures are re-emitted as ::error:: annotations so they are visible
        # through the Checks annotations API (the only channel some environments
        # can read) and in the PR UI — not buried in a log blob.
        run: |
          set -o pipefail
          just test-all 2>&1 | tee test-all.log || {
            status=$?
            echo "::error::just test-all exited ${status} — annotating tail of output"
            tail -n 40 test-all.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "${line}"
            done
            exit "${status}"
          }
