# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Quality Gates
permissions:
  actions: read
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  must-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild ripgrep
      - name: Run must invariants
        run: ./scripts/run-must-gates.sh
      - name: Verify trust manifests
        run: ./scripts/trust/verify-manifest.sh
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        # Pin the action independently of the requested Rust toolchain.
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild
      - name: Run unified test gate
        # Failures are re-emitted as ::error:: annotations so they are visible
        # through the Checks annotations API (the only channel some environments
        # can read) and in the PR UI — not buried in a log blob. The API caps
        # annotations per check at ~10, so lines are chunked several-per-message
        # with %0A separators; each chunk is self-describing (CHUNK i/N with
        # L<n> line numbers).
        run: |
          set -o pipefail
          just test-all 2>&1 | tee test-all.log || {
            status=$?
            total=$(grep -c '' test-all.log)
            echo "::error::just test-all exited ${status} — log has ${total} lines"
            mapfile -t lines < <(grep -n '' test-all.log | sed 's/\r$//')
            n=${#lines[@]}
            chunk=5
            chunks=$(( (n + chunk - 1) / chunk ))
            # Emit in reverse chunk order: the annotations API keeps roughly
            # the first ten annotations created, so the tail of the log has to
            # be created first to be visible.
            c=$chunks
            while [ "$c" -ge 1 ]; do
              msg=""
              for line in "${lines[@]:c*chunk-chunk:chunk}"; do
                line="${line//'%'/'%25'}"
                if [ -z "$msg" ]; then msg="$line"; else msg="${msg}%0A${line}"; fi
              done
              printf '::error::CHUNK %d/%d| %s\n' "$c" "$chunks" "$msg"
              c=$((c - 1))
            done
            exit "${status}"
          }
