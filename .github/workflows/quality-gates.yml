# SPDX-License-Identifier: MPL-2.0
name: Quality Gates
permissions:
  actions: read
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  must-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild ripgrep
      - name: Run must invariants
        run: ./scripts/run-must-gates.sh
      - name: Verify trust manifests
        run: ./scripts/trust/verify-manifest.sh
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
      - name: Install Rust toolchain
        # v1 tag, not a SHA: dtolnay force-moves toolchain branches, so no
        # symbolic ref contains the old pin and lockfile generation refuses it.
        # The actions.lock records the resolved SHA; the toolchain must be an
        # explicit input because the ref no longer selects it.
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just gnat gprbuild
      - name: Run unified test gate
        run: just test-all
