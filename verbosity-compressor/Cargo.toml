# SPDX-License-Identifier: MPL-2.0
[package]
name = "vex-verbosity-compressor"
version = "0.1.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
license = "MPL-2.0"
description = "Information density optimisation for LLM output - reduces LPS and TII metrics"
homepage = "https://github.com/hyperpolymath/vexometer"
repository = "https://github.com/hyperpolymath/vexometer"
readme = "README.adoc"
keywords = ["llm", "verbosity", "filler", "vexometer"]
categories = ["development-tools", "command-line-utilities", "text-processing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "vex-verbosity-compressor"
path = "src/main.rs"

[lib]
name = "vex_verbosity_compressor"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
